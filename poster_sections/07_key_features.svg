  <text x="90" y="130" font-size="62" font-weight="900" fill="#0f3d2e" font-family="Arial, sans-serif">Key Features</text>
  
  
  <circle cx="115" cy="277" r="7" fill="#7bc47f" />
<text x="143" y="285" font-size="34" font-weight="650" fill="#1d2b24">Kitchen inventory tracking for adding, editing, deleting,</text>
<text x="143" y="327.5" font-size="34" font-weight="650" fill="#1d2b24">searching, and scanning food items.</text>
<circle cx="115" cy="384" r="7" fill="#7bc47f" />
<text x="143" y="392" font-size="34" font-weight="650" fill="#1d2b24">Expiry date monitoring with clear visual indicators for urgent</text>
<text x="143" y="434.5" font-size="34" font-weight="650" fill="#1d2b24">and expired items.</text>
<circle cx="115" cy="491" r="7" fill="#7bc47f" />
<text x="143" y="499" font-size="34" font-weight="650" fill="#1d2b24">Recipe suggestions based on ingredients available in the</text>
<text x="143" y="541.5" font-size="34" font-weight="650" fill="#1d2b24">inventory.</text>
<circle cx="115" cy="598" r="7" fill="#7bc47f" />
<text x="143" y="606" font-size="34" font-weight="650" fill="#1d2b24">Predictive grocery plan that suggests missing ingredients and</text>
<text x="143" y="648.5" font-size="34" font-weight="650" fill="#1d2b24">useful staples.</text>
<circle cx="115" cy="705" r="7" fill="#7bc47f" />
<text x="143" y="713" font-size="34" font-weight="650" fill="#1d2b24">Barcode scanner for faster item entry.</text>
<circle cx="115" cy="769.5" r="7" fill="#7bc47f" />
<text x="143" y="777.5" font-size="34" font-weight="650" fill="#1d2b24">AI food assistant for recipe, storage, grocery, and food waste</text>
<text x="143" y="820" font-size="34" font-weight="650" fill="#1d2b24">questions.</text>

  
