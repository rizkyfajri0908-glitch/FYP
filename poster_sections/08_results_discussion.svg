  <text x="94" y="188" font-size="30" font-weight="800" fill="#1f7a4d" letter-spacing="2" font-family="Arial, sans-serif">USER FEEDBACK SURVEY</text>
  <text x="95" y="265" font-size="38" font-weight="550" fill="#1d2b24">EcoBite was evaluated through a user feedback survey with 63</text>
<text x="95" y="316.3" font-size="38" font-weight="550" fill="#1d2b24">respondents. The results showed generally positive feedback toward the</text>
<text x="95" y="367.6" font-size="38" font-weight="550" fill="#1d2b24">app usability and its food waste reduction purpose.</text>
  
  <g font-family="Arial, sans-serif">
