  <text x="90" y="130" font-size="62" font-weight="900" fill="#0f3d2e" font-family="Arial, sans-serif">Introduction</text>
  
  <text x="95" y="265" font-size="38" font-weight="550" fill="#1d2b24">Household food waste is commonly caused by poor meal planning,</text>
<text x="95" y="316.3" font-size="38" font-weight="550" fill="#1d2b24">overbuying, forgotten ingredients, and lack of awareness of expiry</text>
<text x="95" y="367.6" font-size="38" font-weight="550" fill="#1d2b24">dates. EcoBite was developed as a smart kitchen assistant to help</text>
<text x="95" y="418.9" font-size="38" font-weight="550" fill="#1d2b24">users manage kitchen inventory, monitor expiry dates, receive recipe</text>
<text x="95" y="470.20000000000005" font-size="38" font-weight="550" fill="#1d2b24">suggestions, and plan groceries more efficiently.</text>
  
  
</svg>