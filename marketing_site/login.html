<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Log in to EcoBite, the smart kitchen assistant for recipe ideas, expiry reminders, and grocery planning."
    />
    <meta name="theme-color" content="#0f3d2e" />
    <title>Log In | EcoBite</title>
    <link rel="icon" href="/assets/ecobite_logo.png" />
    <link rel="apple-touch-icon" href="/assets/ecobite_logo.png" />
    <link rel="stylesheet" href="/styles.css?v=14" />
  </head>
  <body>
    <header class="site-header">
      <nav class="nav" aria-label="Main navigation">
        <a class="brand" href="/index.html?v=14" aria-label="EcoBite home">
          <img src="/assets/ecobite_logo.png" alt="" />
          <span>EcoBite</span>
        </a>
        <div class="nav-links login-nav-links">
          <a href="/index.html?v=14#features">Features</a>
          <a href="/index.html?v=14#how-it-works">See How It Works</a>
        </div>
      </nav>
    </header>

    <main class="login-page">
      <section class="login-panel">
        <div class="login-intro">
          <img src="/assets/ecobite_logo.png" alt="EcoBite logo" />
          <p class="eyebrow">Welcome to EcoBite</p>
          <h1>Your smarter kitchen starts here</h1>
          <p>
            Log in to manage your kitchen inventory, discover recipe ideas, track expiry dates and plan groceries with less waste.
          </p>
        </div>

        <form class="login-form">
          <label>
            Email
            <input type="email" placeholder="you@example.com" autocomplete="email" />
          </label>
          <label>
            Password
            <input type="password" placeholder="Enter your password" autocomplete="current-password" />
          </label>
          <button class="button primary" type="button">Log In</button>
          <a class="button secondary" href="/index.html?v=14">Back to Website</a>
        </form>
      </section>
    </main>
  </body>
</html>
